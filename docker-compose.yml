services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend/eureka-server

    container_name: eureka-server

    env_file:
      - .env.docker

    ports:
      - "8761:8761"

    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway

    container_name: api-gateway

    env_file:
      - .env.docker

    ports:
      - "8080:8080"

    depends_on:
      eureka-server:
        condition: service_started

    restart: unless-stopped

  auth-service:
    build:
      context: ./backend/auth-service

    container_name: auth-service

    env_file:
      - .env.docker

    ports:
      - "8087:8087"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    restart: unless-stopped

  user-service:
    build:
      context: ./backend/user-service

    container_name: user-service

    env_file:
      - .env.docker

    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    restart: unless-stopped

  destination-service:
    build:
      context: ./backend/destination-service

    container_name: destination-service

    env_file:
      - .env.docker

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    restart: unless-stopped

  trip-service:
    build:
      context: ./backend/trip-service

    container_name: trip-service

    env_file:
      - .env.docker

    ports:
      - "8083:8083"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    restart: unless-stopped

  preference-service:
    build:
      context: ./backend/preference-service

    container_name: preference-service

    env_file:
      - .env.docker

    ports:
      - "8086:8086"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    restart: unless-stopped

  maps-service:
    build:
      context: ./backend/maps-service

    container_name: maps-service

    env_file:
      - .env.docker

    ports:
      - "8085:8085"

    depends_on:
      eureka-server:
        condition: service_started

    restart: unless-stopped

  weather-service:
    build:
      context: ./backend/weather-service

    container_name: weather-service

    env_file:
      - .env.docker

    ports:
      - "8084:8084"

    depends_on:
      eureka-server:
        condition: service_started
      maps-service:
        condition: service_started

    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service

    container_name: ai-service

    env_file:
      - .env.docker

    ports:
      - "8088:8088"

    depends_on:
      eureka-server:
        condition: service_started

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      api-gateway:
        condition: service_started

    restart: unless-stopped
volumes:
  mysql_data:

