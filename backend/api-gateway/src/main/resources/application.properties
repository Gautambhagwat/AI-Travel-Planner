spring.application.name=API-GATEWAY

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Discovery
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# Route to Maps Service
spring.cloud.gateway.server.webmvc.routes[0].id=maps-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MAPS-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/maps/**

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always